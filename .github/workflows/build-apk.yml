name: Build Nora Tunnel APK

# Builds the REAL Android client: the upstream sing-box core is compiled from
# source with gomobile, then Gradle assembles the APK and the artifact is
# published for download (and attached to a release on main).

on:
  push:
    branches: [main, master]
    paths:
      - "android-native/**"
      - ".github/workflows/build-apk.yml"
      - "src/lib/device.ts"
      - "src/app/api/device/**"
  workflow_dispatch:
    inputs:
      sing_box_tag:
        description: "sing-box tag to compile into libbox.aar"
        required: false
        default: "v1.14.2"
      rebuild_core:
        description: "Rebuild the core even if libbox.aar is committed (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Go (needed only to compile the core)
        if: ${{ inputs.rebuild_core == 'true' || !hashFiles('android-native/app/libs/libbox.aar') }}
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;28.2.13676358"

      - name: Compile the upstream sing-box core (gomobile)
        if: ${{ inputs.rebuild_core == 'true' || !hashFiles('android-native/app/libs/libbox.aar') }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
        run: bash android-native/scripts/build-libbox.sh ${{ inputs.sing_box_tag || 'v1.14.2' }}

      - name: Verify the core is present
        run: |
          test -f android-native/app/libs/libbox.aar
          ls -la android-native/app/libs/libbox.aar

      - name: Assemble the APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: bash android-native/scripts/build-apk.sh

      - name: Prove the APK contains the real core
        run: |
          unzip -l public/nora-tunnel-debug.apk | grep -E "lib/.*libbox\.so" || (echo "core missing from APK" && exit 1)
          unzip -l public/nora-tunnel-debug.apk | grep -E "classes.*dex" || (echo "app classes missing" && exit 1)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nora-tunnel-apk
          path: public/nora-tunnel-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to a release (main only)
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Nora Tunnel APK build ${{ github.run_number }}
          body: |
            Real Android client built from ${{ github.sha }}.
            Contains the upstream sing-box core (lib/arm64-v8a/libbox.so) and a real
            Android VpnService. Install on Android 7+ (arm64) and allow installs from
            your browser or file manager.
          files: public/nora-tunnel-debug.apk
