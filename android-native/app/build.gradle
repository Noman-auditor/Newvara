plugins { id "com.android.application" }

android {
    namespace "com.nora.tunnel"
    compileSdk 34

    defaultConfig {
        applicationId "com.nora.tunnel"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        ndk { abiFilters "arm64-v8a" }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures { buildConfig true }

    packagingOptions {
        jniLibs { useLegacyPackaging true }
        resources { excludes += ["/META-INF/*.kotlin_module", "META-INF/DEPENDENCIES", "META-INF/LICENSE*"] }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Real upstream sing-box core, compiled from SagerNet/sing-box with gomobile.
    // Provides: VLESS (incl. XTLS-Reality), VMess, Trojan, Shadowsocks, Hysteria2, TUIC,
    // WireGuard, plus the native TUN stack (gVisor) used by the VpnService.
    implementation(name: "libbox", ext: "aar")
}
